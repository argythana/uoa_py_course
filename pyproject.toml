[project]
name = "uoa-py-course"
version = "0.1.0"
description = "University of Athens BIS-Analytics MSc course: Python for Data Science, Machine Learning and AI — lecture material."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Thanasis Argyriou" }]
dependencies = [
    # Data
    "pandas",
    "numpy",
    "scipy",
    "joblib",
    # ML
    "scikit-learn",
    "statsmodels",
    # Plots
    "matplotlib",
    "seaborn",
    "plotly",
    "vizro",
    # Web apps & deploy (Lecture 08g + Lecture 09 HF Space)
    "streamlit",
    "dash",
    "taipy",
    "gradio",
    # EDA / auto-EDA (Lecture 08f)
    "sweetviz",
    "pygwalker",
    # Notebooks
    "jupyterlab",
    "ipython",
    "pingouin>=0.6.1",
    "mlflow>=3.13.0",
]

[dependency-groups]
dev = [
    "google-api-python-client>=2.196.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "langdetect>=1.0.9",
    "odfpy>=1.4.1",
    "prek>=0.4.10",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "ruff>=0.15.12",
]
# Assignment-grading only: packages a student's submission needs that are not
# course deps (e.g. xgboost). Add via `uv add --group grading <pkg>` when a
# notebook fails on a missing import during grading. Non-default group, so it
# never reaches the student-facing `uv export` (requirements.txt) and a plain
# `uv sync` removes the packages again after the grading session.
grading = [
    "xgboost>=3.3.0",
]

# Pending lectures (10–13 ML, 14–16 PyTorch) will add their own deps here as
# they're refactored. Examples to add when the time comes:
#   uv add torch torchvision         # lectures 14–16
#   uv add xgboost lightgbm          # ensemble methods
#   uv add ydata-profiling pingouin imbalanced-learn  # extra EDA / preprocessing
