# Pre-commit guardrails for a public teaching repo that lives next to private
# student data: block secrets and accidental large/binary additions, and run
# bandit on the operational Python (automation + skills scripts) — teaching
# scripts are deliberately out of scope, they trip security linters by design.
# Run with prek (or classic pre-commit): `prek install`, `prek run --all-files`.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        files: ^(automation_infrastructure|\.claude/skills)/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]
